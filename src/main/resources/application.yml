server:
  # PORT는 Railway/Render 등 대부분의 PaaS가 자동으로 주입하는 환경변수. 없으면 로컬 기본값 8080 사용.
  port: ${PORT:8080}

spring:
  application:
    name: jp-vocab-backend

  # 아래 datasource 값은 로컬 개발용 기본값이다. 배포 환경에서는 SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
  # 환경변수를 설정하면 Spring Boot가 자동으로 이 값을 덮어쓴다(별도 코드 수정 불필요).
  datasource:
    url: jdbc:mysql://localhost:3306/jpvocab?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # dev 편의를 위해 매 기동 시 스키마를 재생성한다.
      # 운영에서는 application-prod.yml에서 'update'로 덮어써서 데이터를 보존한다.
      ddl-auto: create-drop
    # Hibernate가 스키마(테이블)를 먼저 만든 뒤에 data.sql이 실행되도록 순서를 미룬다.
    # 이게 없으면 data.sql이 테이블 생성보다 먼저 실행되어 "table doesn't exist" 오류가 난다.
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  sql:
    init:
      # data.sql은 INSERT IGNORE로 작성되어 있어 매 기동시 실행돼도 기존 데이터를 건드리지 않고 안전하다.
      mode: always
      encoding: UTF-8

jwt:
  # 데모/개발용 시크릿. 운영 배포 전 반드시 환경변수(JWT_SECRET)로 교체할 것 (32자 이상, 안 그러면 서버가 안 뜬다).
  secret: ${JWT_SECRET:dev-only-jp-vocab-secret-key-change-me-please-1234567890}
  # 액세스 토큰(JWT): 짧게 유지 (탈취돼도 피해 최소화)
  expiration-seconds: 1800
  # 리프레시 토큰(DB 저장): 길게 유지, 이 기간 동안은 재로그인 없이 액세스 토큰 재발급 가능
  refresh-expiration-days: 14

cors:
  # 콤마로 여러 오리진 지정 가능. 배포 시 CORS_ALLOWED_ORIGINS 환경변수로 프론트엔드 도메인을 추가하면 된다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app:
  email-verification-expiration-hours: 24
  # 비밀번호 재설정 토큰은 탈취 시 위험도가 높아서 훨씬 짧게 잡는다.
  password-reset-expiration-minutes: 30
