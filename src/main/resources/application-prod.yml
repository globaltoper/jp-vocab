# 배포 환경 프로필. SPRING_PROFILES_ACTIVE=prod 로 활성화한다.
# datasource/jwt.secret/cors.allowed-origins는 배포 플랫폼의 환경변수로 주입하고,
# 여기서는 "운영에서 절대 create-drop을 쓰면 안 된다" 같은 안전 설정만 덮어쓴다.
spring:
  jpa:
    hibernate:
      # 재기동/재배포 때마다 테이블을 지우고 새로 만들면 사용자 데이터가 전부 날아간다.
      # update는 없는 테이블/컬럼만 추가하고 기존 데이터는 보존한다.
      ddl-auto: update
    show-sql: false
